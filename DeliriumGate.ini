; DeliriumGate: Skyrim Delirium goes last. It plays only its vanilla reactions (blows, arrows, spells,
; staggers, bumps, explosions, Skyrim's own ragdolls) and steps aside whenever something else has the NPC.
; Delirium itself is not changed. Log: Documents\My Games\Skyrim Special Edition\SKSE\DeliriumGate.log

[General]
; 0 = DeliriumGate does nothing at all (Delirium runs as it is)
bEnabled=1
; log every time Delirium is made to step aside (NPC, where, why)
bLogYields=1
; the same NPC with the same reason is logged at most once every this many seconds
fLogRepeatSeconds=3

[KillMoves]
; an NPC in a kill move (as victim, or her attacker is in one): Delirium leaves her alone, also on the killing blow
bYield=1
; Delirium may not switch kill moves and kill cams off (its bNoKillMoves / bNoKillCams do nothing)
bProtectKillMoves=1
; Delirium's bNoKillMoves sets the KillMove global to 0 and the save keeps it.
; On every load / new game: if it is 0, set it back to 1 (kill moves on)
bRestoreKillMoveGlobal=1
; 1 = Delirium never takes a killing blow by the player ("dying on her feet"), so the game's own death
; plays and kill cams can trigger on every kill. NPC-on-NPC deaths keep Delirium's dying. Off by default
bYieldPlayerKills=0
; the player left stuck after a kill move (walks, but no weapon, no menus): fix it.
; A kill move flag still on after fPlayerStuckSeconds with no paired animation running is cleared;
; fighting / menu controls still off fPlayerControlsAfter s after one of your kill moves ended are switched
; back on (EnablePlayerControls), unless another mod has you (OStim scene, paired animation...). Logged.
bPlayerKillMoveWatch=1
fPlayerStuckSeconds=10
fPlayerControlsAfter=2.0

[PairedAnimations]
; an NPC in a synced / paired animation (bIsSynced: kill moves, executions, feeding, grapples...): Delirium stays out
bYield=1

[Carnage]
; Maximum Carnage's plugin; NPCs that carry one of its gore spells are Carnage's
sPlugin=MaximumCarnage.esp
; their killing blow is the game's own death, so Carnage does its gore (no "dying on her feet" from Delirium)
bYieldDeaths=1
; one of them that dies while Delirium has her (staggering, thrown) is handed back to Skyrim at once
bReleaseCorpses=1
; 1 = Carnage NPCs never get Delirium at all, not even hit reactions while alive
bYieldAll=0

[Dismembering]
; Dismembering Framework's plugin. DF only cuts off a limb when the hit really kills; Delirium's
; "dying on her feet" keeps the NPC alive at 1 health, so with it DF never dismembers anyone.
sPlugin=Dismembering Framework.esm
; 1 = a killing blow DF may dismember is the game's own death, so DF gets its chance. "May" follows
; DF's own MCM settings: who can dismember / be dismembered, "if fatal", and the killer's weapon type.
; DF's dice roll then decides if a limb comes off; when it doesn't, that NPC simply dies the vanilla way.
; 0 = Delirium keeps its dying on every death (DF then rarely or never dismembers)
bYieldDeaths=1
; only NPCs of races DF has limbs for (read from Data\SKSE\DismemberingFramework\*_DATA.json)
bCheckRaces=1

[FEC]
; Frozen Electrocuted Combustion's plugin. FEC picks its death effect (frozen, ice block, shattered,
; charred, ash, electrocuted, drained, sun) from the victim's fire / frost / shock / drain / sun magic
; effects at the moment she dies. Delirium's "dying on her feet" delays that by seconds, by then the
; effects are gone and FEC shows nothing.
sPlugin=FEC.esp
; 1 = a killing blow while such an effect is on her is the game's own death, so FEC gets it.
; Follows FEC's own rules: not on NPCs it skips (ghosts, children, summons, FEC_NoDeathEffects) and not
; for a type whose MCM chance is 0. FEC's dice roll then decides. 0 = Delirium keeps its dying.
bYieldDeaths=1
; 1 = Delirium never picks up those corpses (a frozen or charred body must not be thrown around)
bKeepCorpses=1

[Ragdoll]
; Delirium takes over Skyrim's ragdoll only when a real hit put her there (shout, explosion, blow, arrow, spell, trap).
; A ragdoll from a script or another mod (a push, a grab, a throw) is left to that mod.
bVanillaOnly=1
; seconds after that hit
fHitWindow=1.0

[OtherMods]
; comma separated. An NPC with any of these is another mod's: Delirium stays out and hands her back.
; factions as Plugin.esp|0xLocalFormID  (OStim.esp|0xD93 = OStim's scene actor faction)
sFactions=OStim.esp|0xD93
; keyword editor IDs on the NPC or her race
sKeywords=
; active magic effects that carry one of these keyword editor IDs
sEffectKeywords=
; active magic effects (spell or effect) from these plugins
sEffectPlugins=
; hits whose weapon, spell or projectile comes from these plugins do not count as vanilla:
; they keep Delirium away from that NPC for fSourceBlockSeconds
sSourcePlugins=
fSourceBlockSeconds=1.0

[DeathCheck]
; a few seconds after an NPC dies, and once more later: if she is dead but still not in Skyrim's ragdoll
; (stuck on her feet, tilted, or looping a death animation), send RagdollInstant so she drops.
; Waits while she is still in a kill move / paired animation. Every fix is logged.
; (Death Idle Fix still covers bodies after loading screens and cell changes.)
bEnabled=1
; seconds after death
fFirstCheck=3.0
fSecondCheck=8.0
; Delirium sometimes never finishes a death it took ("dying on her feet"): the NPC stays alive at
; 1 health, stops fighting and stands in a broken pose (T-pose) until the next loading screen.
; fStuckDyingSeconds after the killing blow DeliriumGate makes Delirium let her go (that finishes the
; death); if she is still alive 1 s later it kills her itself, credited to the same killer.
; Waits while she is in a kill move or paired animation. Essential NPCs are left alone. Logged.
bFinishStuckDying=1
fStuckDyingSeconds=8.0

[Release]
; an NPC Delirium already drives is handed back (Delirium's own Release) as soon as one of the rules above starts
bReleaseHeld=1
; how often that is checked, ms (main thread)
iWatchIntervalMs=50
